appId: com.inkspace.app
productName: InkSpace
directories:
  output: release
  buildResources: build
files:
  - out/**
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
linux:
  target: [AppImage]
npmRebuild: false
