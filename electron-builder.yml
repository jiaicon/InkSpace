appId: com.inkspace.app
productName: InkSpace
directories:
  output: release
  buildResources: build
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown 文档
    role: Editor
  - ext: markdown
    name: Markdown Document
    description: Markdown 文档
    role: Editor
files:
  - out/**
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
mac:
  target: [dmg]
linux:
  target: [AppImage]
npmRebuild: false
