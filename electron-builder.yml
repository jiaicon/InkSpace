appId: com.inkspace.app
productName: InkSpace
directories:
  output: release
  buildResources: build
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown 文档
    role: Editor
  - ext: markdown
    name: Markdown Document
    description: Markdown 文档
    role: Editor
files:
  - out/**
  # mermaid 只用到 dist/mermaid.min.js（自包含 UMD，已内联全部图表类型）。
  # 其余 117MB 是源映射、ESM 分包与未压缩版，全部排除。
  # 实测：mermaid 在 asar 里共占 9.2MB（不排除的话是 122MB）。剩下的 3.9MB 是 mermaid
  # 自带的一份 katex —— electron-builder 收集生产依赖时会绕过 files 的排除规则，排不掉。
  - '!node_modules/mermaid/**'
  - node_modules/mermaid/package.json
  - node_modules/mermaid/dist/mermaid.min.js
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  # 快捷方式显示名（中文「墨境」）在 build/installer.nsh 里定义 —— 不能用 shortcutName：
  # 该值会经命令行 -D 传给 makensis，非 ASCII 会被按本地代码页转换而变成乱码。
  # exe 名与安装目录仍由上面的 productName 决定，保持 InkSpace 不变。
mac:
  target: [dmg]
linux:
  target: [AppImage]
npmRebuild: false
